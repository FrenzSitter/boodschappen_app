# Docker Compose configuration for Price History Tracking System
# ===============================================================

version: '3.8'

services:
  # Main API service
  price-history-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: price-history-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - CACHE_TTL=300
      - RATE_LIMIT=100
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - prometheus
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - price-history-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Import service (scheduled)
  price-history-import:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: price-history-import
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - IMPORT_SCHEDULE=0 6 * * *  # Daily at 6 AM
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./cron:/etc/cron.d
    networks:
      - price-history-network
    command: ["python", "-m", "scheduler"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Monitoring service
  price-history-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: price-history-monitor
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - MONITORING_SCHEDULE=0 */6 * * *  # Every 6 hours
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - ALERT_RECIPIENTS=${ALERT_RECIPIENTS}
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - price-history-network
    command: ["python", "-m", "monitoring_scheduler"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: price-history-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - price-history-network
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: price-history-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - price-history-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: price-history-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - price-history-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backup service
  backup-service:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: price-history-backup
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - BACKUP_SCHEDULE=0 2 * * *  # Daily at 2 AM
      - BACKUP_RETENTION_DAYS=30
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    networks:
      - price-history-network
    command: ["python", "-m", "backup_scheduler"]

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  price-history-network:
    driver: bridge