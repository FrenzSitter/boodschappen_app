# Alertmanager Configuration for Price History System
# ==================================================

global:
  smtp_smarthost: '${SMTP_SERVER}:${SMTP_PORT}'
  smtp_from: '${EMAIL_FROM}'
  smtp_auth_username: '${EMAIL_FROM}'
  smtp_auth_password: '${EMAIL_PASSWORD}'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 1h
    - match:
        alertname: BackupFailed
      receiver: 'backup-alerts'
      repeat_interval: 30m
    - match:
        alertname: ImportFailed
      receiver: 'import-alerts'
      repeat_interval: 30m

receivers:
  - name: 'web.hook'
    email_configs:
      - to: '${ALERT_RECIPIENTS}'
        subject: 'Price History Alert - {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}

  - name: 'critical-alerts'
    email_configs:
      - to: '${ALERT_RECIPIENTS}'
        subject: 'CRITICAL: Price History System Alert'
        body: |
          🚨 CRITICAL ALERT 🚨
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          
          This requires immediate attention!
          {{ end }}

  - name: 'warning-alerts'
    email_configs:
      - to: '${ALERT_RECIPIENTS}'
        subject: 'WARNING: Price History System Alert'
        body: |
          ⚠️ WARNING ALERT ⚠️
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}

  - name: 'backup-alerts'
    email_configs:
      - to: '${ALERT_RECIPIENTS}'
        subject: 'Backup Alert - Price History System'
        body: |
          💾 BACKUP ALERT 💾
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          
          Please check backup system immediately.
          {{ end }}

  - name: 'import-alerts'
    email_configs:
      - to: '${ALERT_RECIPIENTS}'
        subject: 'Import Alert - Price History System'
        body: |
          📥 IMPORT ALERT 📥
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          
          Data import may be affected.
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']