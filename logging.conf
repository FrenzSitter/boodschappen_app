# Logging Configuration for Price History System
# ==============================================

[loggers]
keys=root,price_history,import,backup,monitoring,api

[handlers]
keys=consoleHandler,fileHandler,rotatingFileHandler,errorHandler

[formatters]
keys=simpleFormatter,detailedFormatter,jsonFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_price_history]
level=INFO
handlers=fileHandler,rotatingFileHandler
qualname=price_history
propagate=0

[logger_import]
level=INFO
handlers=fileHandler,rotatingFileHandler
qualname=import
propagate=0

[logger_backup]
level=INFO
handlers=fileHandler,rotatingFileHandler
qualname=backup
propagate=0

[logger_monitoring]
level=INFO
handlers=fileHandler,rotatingFileHandler
qualname=monitoring
propagate=0

[logger_api]
level=INFO
handlers=fileHandler,rotatingFileHandler
qualname=api
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=detailedFormatter
args=('/app/logs/price_history.log', 'a')

[handler_rotatingFileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=detailedFormatter
args=('/app/logs/price_history.log', 'a', 10485760, 5)

[handler_errorHandler]
class=FileHandler
level=ERROR
formatter=detailedFormatter
args=('/app/logs/error.log', 'a')

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_detailedFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(funcName)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_jsonFormatter]
format={"timestamp": "%(asctime)s", "logger": "%(name)s", "level": "%(levelname)s", "file": "%(filename)s", "line": %(lineno)d, "function": "%(funcName)s", "message": "%(message)s"}
datefmt=%Y-%m-%d %H:%M:%S